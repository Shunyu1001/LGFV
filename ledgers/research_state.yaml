immutable_version: charter-v1
research_question: >-
  How can researchers distinguish formal LGFV exit from functional fiscal
  change, and what local conditions are associated with institutional fate?
primary_contribution: measurement framework for institutional fate
secondary_application: exploratory association with historical state capacity

state:
  literature:
    status: yellow
    main_gap: >-
      A 24-source verified audit narrows the defensible novelty claim, but the
      manuscript and bibliography have not yet incorporated that boundary.
  theory_identification:
    status: yellow
    main_gap: >-
      Three mechanisms are stated, but discriminating observable implications
      and the persistence link from historical capacity remain incomplete.
  empirical_simulation:
    status: red
    main_gap: >-
      The gold outcome has 12 institutional-change cases, complete controls
      exclude six low-capacity nominal exits, and the adjusted design is rank
      deficient and deletion-sensitive.
  claim_evidence:
    status: red
    main_gap: >-
      Three narrative effect sizes require correction, and measurement
      validation lacks a probability sample, independent agreement, recall,
      multiclass error, and traceable geography for most proposed issuers.
  reviewer:
    status: red
    top_risk: >-
      The paper currently reads as an advanced measurement pilot rather than a
      journal-ready national study.

current_bottleneck: probability validation, independent coding, and sparse-outcome empirical credibility
next_recommended_loops:
  - empirical_simulation
  - literature
  - claim_evidence
pending_human_decisions: []
stop_conditions_met: false
