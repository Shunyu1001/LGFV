immutable_version: charter-v1
research_question: >-
  How can researchers distinguish formal LGFV exit from functional fiscal
  change, and what local conditions are associated with institutional fate?
primary_contribution: measurement framework for institutional fate
secondary_application: exploratory association with historical state capacity

state:
  literature:
    status: green
    main_gap: >-
      The manuscript and bibliography incorporate the 24-source verified
      novelty audit. Future revisions should preserve the bounded claim that
      the contribution is a source-auditable measurement framework.
  theory_identification:
    status: yellow
    main_gap: >-
      Three mechanisms and their observable implications are stated, but the
      persistence link from historical capacity and mediation remain
      unidentified in the current evidence.
  empirical_simulation:
    status: red
    main_gap: >-
      The working-reference outcome has only 12 institutional-change events. The corrected
      adjusted design has full rank, but its historical-capacity estimates are
      small and deletion-sensitive, and province fixed effects are unsupported.
  claim_evidence:
    status: red
    main_gap: >-
      The 94 working reference labels were produced through Codex source-packet
      review and await independent human confirmation. Measurement validation
      also lacks realized probability validation, recall, and multiclass error
      estimates. The current source-verified candidate contains 67 eligible
      issuers; all 98 inherited scope reviews are resolved. Of the 88 inherited
      geography gaps, 87 are unique and one already-ineligible issuer retains
      multiple geography under the approved rule. Final frame freeze and
      independent human coding have not occurred.
  reviewer:
    status: red
    top_risk: >-
      The manuscript is a polished advanced measurement paper, but reviewers
      can still reject national empirical claims because the working labels are
      not yet human confirmed or probability validated and the rare-outcome
      models are fragile.

