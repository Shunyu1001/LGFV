immutable_version: charter-v1
research_question: >-
  How can researchers distinguish formal LGFV exit from functional fiscal
  change, and what local conditions are associated with institutional fate?
primary_contribution: measurement framework for institutional fate
secondary_application: exploratory association with historical state capacity

state:
  literature:
    status: green
    main_gap: >-
      The manuscript and bibliography incorporate the 24-source verified
      novelty audit. Future revisions should preserve the bounded claim that
      the contribution is a source-auditable measurement framework.
  theory_identification:
    status: yellow
    main_gap: >-
      Three mechanisms and their observable implications are stated, but the
      persistence link from historical capacity and mediation remain
      unidentified in the current evidence.
  empirical_simulation:
    status: red
    main_gap: >-
      The gold outcome has only 12 institutional-change events. The corrected
      adjusted design has full rank, but its historical-capacity estimates are
      small and deletion-sensitive, and province fixed effects are unsupported.
  claim_evidence:
    status: red
    main_gap: >-
      Measurement validation lacks a probability sample, completed independent
      coding, recall, and multiclass error estimates. Geography remains
      unresolved for 88 candidate issuers, and 98 require scope review.
  reviewer:
    status: red
    top_risk: >-
      The manuscript is a polished advanced measurement paper, but reviewers
      can still reject national empirical claims because validation is not yet
      independent or probability-based and the rare-outcome models are fragile.

current_bottleneck: probability validation, independent coding, and sparse-outcome empirical credibility
next_recommended_loops:
  - claim_evidence
  - empirical_simulation
pending_human_decisions:
  - approve source access and assign a genuine second coder for the blank 94-case packet
  - adjudicate scope and complete the 88 unresolved geography and 98 scope reviews
  - approve a probability validation draw only after the issuer frame passes its coverage gate
stop_conditions_met: false
