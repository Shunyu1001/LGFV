secondary_application: exploratory association with historical state capacity

state:
  literature:
    status: red
    main_gap: >-
      The bibliography contains 21 entries and does not yet establish the
      novelty boundary against recent LGFV, compliance, and text-measurement
      work.
  theory_identification:
    status: yellow
    main_gap: >-
      Three mechanisms are stated, but discriminating observable implications
      and the persistence link from historical capacity remain incomplete.
  empirical_simulation:
    status: red
    main_gap: >-
      The gold outcome is highly imbalanced, contemporary controls are partial,
      and the DSL default input points to an older surrogate file.
  claim_evidence:
    status: red
    main_gap: >-
      Narrative effect sizes do not match the generated pilot regression table,
      and measurement validation lacks independent agreement and recall.
  reviewer:
    status: red
    top_risk: >-
      The paper currently reads as an advanced measurement pilot rather than a
      journal-ready national study.

