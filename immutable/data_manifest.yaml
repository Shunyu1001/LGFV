source_packet_status:
  tracked_raw_documents: false
  note: >-
    The repository tracks inventories, extracted evidence memos, and URLs but
    does not contain the underlying raw source packet archive. A submission
    archive requires a rights-aware source manifest, stable retrieval fields,
    and a documented reconstruction procedure.

prohibited_actions:
  - overwrite source documents or raw snapshots
  - infer missing control values without a declared rule
  - treat document rows as independent issuers
  - treat LLM surrogates as human gold labels
